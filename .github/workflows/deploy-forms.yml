name: Deploy forms Worker

# Deploys workers/forms (forms.wyldwandering.com) to Cloudflare.
# Needs these repository secrets:
#   CLOUDFLARE_API_TOKEN   "Edit Cloudflare Workers" token for the account and wyldwandering.com zone
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare account ID
#   PROTON_SMTP_TOKEN      Proton SMTP token for hello@wyldwandering.com
#   TURNSTILE_SECRET_KEY   Secret key of the wyldwandering.com Turnstile widget

on:
  push:
    branches: [main]
    paths:
      - "workers/forms/**"
      - ".github/workflows/deploy-forms.yml"
  workflow_dispatch:

concurrency:
  group: "forms-worker"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.PROTON_SMTP_TOKEN != '' && secrets.TURNSTILE_SECRET_KEY != '' }}
    steps:
      - name: Skip until secrets are added
        if: env.HAS_SECRETS != 'true'
        run: echo "::notice::Forms Worker not deployed. Add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, PROTON_SMTP_TOKEN and TURNSTILE_SECRET_KEY as repository secrets, then run this workflow."

      - name: Checkout
        if: env.HAS_SECRETS == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: env.HAS_SECRETS == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: workers/forms/package-lock.json

      - name: Install dependencies
        if: env.HAS_SECRETS == 'true'
        working-directory: workers/forms
        run: npm ci

      - name: Typecheck
        if: env.HAS_SECRETS == 'true'
        working-directory: workers/forms
        run: npx tsc --noEmit

      - name: Deploy
        if: env.HAS_SECRETS == 'true'
        working-directory: workers/forms
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SMTP_TOKEN: ${{ secrets.PROTON_SMTP_TOKEN }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          npx wrangler deploy
          printf '%s' "$SMTP_TOKEN" | npx wrangler secret put SMTP_TOKEN
          printf '%s' "$TURNSTILE_SECRET_KEY" | npx wrangler secret put TURNSTILE_SECRET_KEY

      - name: Health check
        if: env.HAS_SECRETS == 'true'
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://forms.wyldwandering.com/ | grep -q ok; then echo "Worker is up"; exit 0; fi
            sleep 10
          done
          echo "::warning::forms.wyldwandering.com did not answer yet. Custom domain certificates can take a few minutes."
